name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Frontmatter, name/directory agreement, description length, referenced
      # files, and script syntax.
      - name: Validate skills
        run: python3 scripts/validate.py

      # The check that matters to users: can the CLI actually see the skills?
      - name: Confirm CLI discovery
        run: npx -y skills@latest add . --list
